name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          INFO_VERSION="$(node -p "require('./info.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          echo "Tag version:     $TAG_VERSION"
          echo "info.json:       $INFO_VERSION"
          echo "package.json:    $PACKAGE_VERSION"

          if [ "$TAG_VERSION" != "$INFO_VERSION" ] || [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version mismatch."
            exit 1
          fi

      - name: Package extension
        shell: bash
        run: |
          mkdir release
          cp dist/index.js release/
          cp dist/info.json release/
          cd release
          zip "../Hider-${GITHUB_REF_NAME}.zip" index.js info.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Hider-${GITHUB_REF_NAME}.zip" \
            --title "Hider ${GITHUB_REF_NAME}" \
            --generate-notes
